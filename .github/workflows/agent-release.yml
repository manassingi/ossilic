name: Publish the agent

# Push a tag like agent-v0.1.0 to publish agent/ to PyPI as `ossilic`. Uses PyPI trusted publishing:
# on pypi.org, add this repository and workflow (agent-release.yml, environment "pypi") as a publisher.
on:
  push:
    tags: ["agent-v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag matches the package version
        run: test "${GITHUB_REF_NAME#agent-v}" = "$(python -c 'import tomllib; print(tomllib.load(open("agent/pyproject.toml", "rb"))["project"]["version"])')"
      - name: Test
        run: cd agent && python -m unittest discover -s tests
      - name: Build
        run: python -m pip install build==1.2.2 && python -m build agent
      - uses: pypa/gh-action-pypi-publish@v1.12.4
        with:
          packages-dir: agent/dist
