name: Ossilic Release Check
description: Ossilic Release Check. Run a robot policy's suite on every change, compare it world by world with the committed baseline, and block the release when it may be meaningfully worse.
branding:
  icon: activity
  color: orange

inputs:
  machine:
    description: Path to machine.json
    required: true
  suite:
    description: Suite name in suites/ or a path; optional when the machine has one suite
    default: ""
  all:
    description: Gate on every suite the machine has (intervals are widened so the whole set keeps its error rate)
    default: "false"
  comment:
    description: Post the report as a pull request comment
    default: "true"
  physics:
    description: Install MuJoCo for physics targets
    default: "false"

outputs:
  report:
    description: Path to the Markdown report
    value: ${{ steps.test.outputs.report }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - if: inputs.physics == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - if: inputs.physics == 'true'
      shell: bash
      run: |
        python -m pip install --disable-pip-version-check -q mujoco numpy
        echo "OSSILIC_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
    # The engine has no dependencies: linking its packages is the whole install.
    - name: Link Ossilic
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH"
        mkdir -p node_modules/@ossilic
        for p in packages/*; do ln -sfn "../../$p" "node_modules/@ossilic/$(basename "$p")"; done
    - name: Run the suite
      id: test
      shell: bash
      env:
        MACHINE: ${{ inputs.machine }}
        SUITE: ${{ inputs.suite }}
        ALL: ${{ inputs.all }}
      run: |
        report="$RUNNER_TEMP/ossilic-report.md"
        args=("$MACHINE" --report "$report")
        [ -n "$SUITE" ] && args+=(--suite "$SUITE")
        [ "$ALL" = "true" ] && args+=(--all)
        set +e
        node "$GITHUB_ACTION_PATH/packages/cli/src/main.ts" test "${args[@]}"
        code=$?
        set -e
        echo "code=$code" >> "$GITHUB_OUTPUT"
        echo "report=$report" >> "$GITHUB_OUTPUT"
        [ -f "$report" ] && cat "$report" >> "$GITHUB_STEP_SUMMARY"
    - name: Comment on the pull request
      if: github.event_name == 'pull_request' && inputs.comment == 'true'
      continue-on-error: true # forks get a read-only token; the job summary still has the report
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
        REPORT: ${{ steps.test.outputs.report }}
        MACHINE: ${{ inputs.machine }}
        SUITE: ${{ inputs.suite }}
      # one comment per machine and suite, updated in place on every push
      run: |
        marker="<!-- ossilic:$(printf '%s' "$MACHINE:$SUITE" | git hash-object --stdin) -->"
        body="$(printf '%s\n%s' "$marker" "$(cat "$REPORT")")"
        id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | tail -1)
        if [ -n "$id" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
        else gh pr comment "$PR" --body "$body"; fi
    - name: Verdict
      shell: bash
      run: exit ${{ steps.test.outputs.code }}
